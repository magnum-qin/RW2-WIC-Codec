name: Bug report
description: Report a reproducible codec, installer, or build problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not attach an RW2 file containing sensitive metadata unless you are comfortable sharing it publicly.
  - type: input
    id: version
    attributes:
      label: Codec version
      placeholder: v1.1.9
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11 x64
        - Windows 10 x64
        - Other or unknown
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera model
      placeholder: Panasonic Lumix model, if relevant
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Install...
        2. Open...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and test output
      description: Paste relevant TestDecoder, TestExif, build, or Event Viewer output.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I tested the latest release.
          required: true
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and sensitive metadata.
          required: true
