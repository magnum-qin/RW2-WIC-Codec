name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Check out pinned vcpkg
      uses: actions/checkout@v7
      with:
        repository: microsoft/vcpkg
        ref: 6d9d7df564a1ccdaa994e4ad39ccd4a32360867b
        path: .vcpkg

    - name: Bootstrap vcpkg
      shell: pwsh
      run: .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -S . -B build -A x64 `
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/.vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DBUILD_TESTING=ON

    - name: Build Codec & Tools
      shell: pwsh
      run: |
        cmake --build build --config Release
        ctest --test-dir build -C Release --output-on-failure

    - name: Stage Release Files
      shell: pwsh
      run: |
        # Copy dependency DLLs from vcpkg to build/Release/
        Copy-Item -Path "build/vcpkg_installed/x64-windows/bin/*.dll" -Destination "build/Release/" -Force
        
        # Copy install scripts
        Copy-Item -Path "scripts/*.bat" -Destination "build/Release/" -Force

        # Include project and dependency license notices in every package
        Copy-Item -Path "LICENSE", "THIRD_PARTY_NOTICES.md" -Destination "build/Release/" -Force
        New-Item -ItemType Directory -Path "build/Release/licenses" -Force | Out-Null
        Get-ChildItem -Path "build/vcpkg_installed/x64-windows/share" -Filter "copyright" -Recurse |
          ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "build/Release/licenses/$($_.Directory.Name).txt" -Force
          }

    - name: Compile Inno Setup Installer
      shell: pwsh
      run: |
        # Inno Setup is pre-installed on GitHub windows-latest runner
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" RW2Codec_Setup.iss

    - name: Create ZIP Package
      shell: pwsh
      run: |
        # Clean up export libraries and build artifacts we don't want to bundle
        Remove-Item -Path "build/Release/*.exp", "build/Release/*.lib" -Force -ErrorAction SilentlyContinue
        # Compress the entire Release directory natively
        Compress-Archive -Path "build/Release/*" -DestinationPath "build/RW2Codec-${{ github.ref_name }}-x64.zip" -Force

    - name: Upload Artifacts to GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        name: "${{ github.ref_name }}"
        body_path: RELEASE_NOTES.md
        files: |
          build/RW2Codec_Setup_v*.exe
          build/RW2Codec-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
