name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.25.x'

    - name: Configure CMake
      shell: pwsh
      run: |
        mkdir build
        cd build
        cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

    - name: Build Codec & Tools
      shell: pwsh
      run: |
        cd build
        cmake --build .
        ctest --output-on-failure
        # Create Release folder and copy binaries to maintain the directory structure expected by Inno Setup
        mkdir Release
        Copy-Item -Path "RW2Codec.dll", "TestDecoder.exe", "TestExif.exe", "TestPerf.exe" -Destination "Release/" -Force

    - name: Stage Release Files
      shell: pwsh
      run: |
        # Copy dependency DLLs from vcpkg to build/Release/
        Copy-Item -Path "vcpkg_installed/x64-windows/bin/*.dll" -Destination "build/Release/" -Force
        
        # Copy install scripts
        Copy-Item -Path "scripts/*.bat" -Destination "build/Release/" -Force

        # Include project and dependency license notices in every package
        Copy-Item -Path "LICENSE", "THIRD_PARTY_NOTICES.md" -Destination "build/Release/" -Force
        New-Item -ItemType Directory -Path "build/Release/licenses" -Force | Out-Null
        Get-ChildItem -Path "vcpkg_installed/x64-windows/share" -Filter "copyright" -Recurse |
          ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "build/Release/licenses/$($_.Directory.Name).txt" -Force
          }

    - name: Compile Inno Setup Installer
      shell: pwsh
      run: |
        # Inno Setup is pre-installed on GitHub windows-latest runner
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" RW2Codec_Setup.iss

    - name: Create ZIP Package
      shell: pwsh
      run: |
        # Clean up export libraries and build artifacts we don't want to bundle
        Remove-Item -Path "build/Release/*.exp", "build/Release/*.lib" -Force -ErrorAction SilentlyContinue
        # Compress the entire Release directory natively
        Compress-Archive -Path "build/Release/*" -DestinationPath "build/RW2Codec-${{ github.ref_name }}-x64.zip" -Force

    - name: Upload Artifacts to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "${{ github.ref_name }}"
        body_path: RELEASE_NOTES.md
        files: |
          build/RW2Codec_Setup_v*.exe
          build/RW2Codec-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
